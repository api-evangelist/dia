aid: dia
name: Dia
description: Dia & Co is a plus-size fashion and personal styling subscription service for women, operated
  by FullBeauty Brands. Customers complete an online style quiz, and stylists curate a monthly box of up
  to seven clothing items in sizes 10 to 32 from hundreds of brands to try on at home, with free shipping
  and free returns both ways. Dia & Co also runs an online shop and has been featured in Vogue, Forbes,
  and Glamour, and was an early portfolio company of Union Square Ventures. It operates as a consumer
  e-commerce brand and publishes no public developer API; this profile tracks its web and security surface
  within the API Evangelist network.
